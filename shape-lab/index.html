x 30px #0008}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}.authbox .brand{padding:0 0 20px}.exercise{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr;gap:8px;align-items:end}.exercise input{min-width:0}.footnote{font-size:11px;color:var(--muted);line-height:1.5}.demo-btn{background:#202628;border:1px solid #3a4245;color:var(--lime);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800}.demo-modal{position:fixed;inset:0;background:#000c;z-index:100;display:grid;place-items:center;padding:16px}.demo-panel{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111516;border:1px solid #343b3e;border-radius:18px;padding:18px}.demo-media{width:100%;max-height:290px;object-fit:contain;background:#080a0b;border-radius:12px;margin:12px 0}.demo-step{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;font-size:13px;line-height:1.5}.demo-section{font-size:11px;color:var(--lime);font-weight:850;letter-spacing:1px;margin-top:15px}

<div id="auth" class="auth"><div class="authbox"><div class="brand">SHAPE <span>LAB</span></div><div class="eyebrow">SUA EVOLUÇÃO, COM DADOS REAIS</div><h1 class="h1" id="authTitle">Entrar na sua conta</h1><p class="muted" style="font-size:13px;margin-bottom:22px">Seus treinos, alimentação e progresso salvos com segurança.</p><form id="authForm" class="stack"><div class="field"><label>E-MAIL</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>SENHA</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn" id="authSubmit">Entrar</button></form><div class="row" style="margin-top:14px"><button class="btn secondary" id="toggleAuth">Criar conta</button><button class="btn secondary" id="forgot">Esqueci a senha</button></div><p class="footnote" style="margin-top:18px">Seus dados são privados e vinculados à sua conta.</p></div></div>

<script>
const SUPABASE_URL="https://qqnvncjqmboesuiwowwa.supabase.co";
const SUPABASE_KEY="sb_publishable_M-8fAkatD9c6CHzz7fXArA_GzK4Pwgw";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let user=null,profile=null,tab="dashboard",authMode="login",records={metrics:[],sessions:[],cardio:[],meals:[],habits:[],exercises:[]};
const nav=[["dashboard","Visão geral"],["workout","Treinamento"],["cardio","Cardio & corrida"],["mobility","Mobilidade"],["nutrition","Nutrição"],["body","Evolução corporal"],["habits","Hábitos & sono"],["assistant","Orientações"],["profile","Meu perfil"]];
function toast(m){$("toast").textContent=m;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(s){return s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"—"}
function setNav(){const mk=(mobile=false)=>nav.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+(mobile?({dashboard:"⌂",workout:"▣",cardio:"↗",mobility:"◉",nutrition:"＋",body:"⌁",habits:"◷",assistant:"✦",profile:"●"}[id]+"<br>"):"")+label+'</button>').join("");$("sideNav").innerHTML=mk();$("mobileNav").innerHTML=mk(true);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab))}
function go(t){tab=t;setNav();$("pageTitle").textContent=nav.find(x=>x[0]===t)?.[1]||"SHAPE LAB";render()}
async function query(table,cols="*"){const {data,error}=await sb.from(table).select(cols).eq("user_id",user.id).order(table==="shape_daily_habits"?"habit_date":table==="shape_body_metrics"?"measured_at":"created_at",{ascending:false}).limit(100);if(error)throw error;return data||[]}
async function loadData(){const specs=[["metrics","shape_body_metrics"],["sessions","shape_workout_sessions"],["cardio","shape_cardio_logs"],["meals","shape_food_logs"],["habits","shape_daily_habits"],["exercises","shape_exercise_logs"]];const results=await Promise.all(specs.map(async([k,t])=>{const data=await query(t);return [k,data]}));for(const [k,data] of results)records[k]=data;}
async function loadProfile(){const {data,error}=await sb.from("shape_profiles").select("*").eq("user_id",user.id).maybeSingle();if(error)throw error;profile=data}
function appOn(){ $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("mobileNav").classList.remove("hidden");$("dateLabel").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});setNav();render()}
function appOff(){$("app").classList.add("hidden");$("mobileNav").classList.add("hidden");$("auth").classList.remove("hidden")}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){user=session.user;await loadProfile();await loadData();appOn()}else appOff()}
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("email").value,password=$("password").value;$("authSubmit").disabled=true;try{let r=authMode==="login"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error)throw r.error;if(authMode==="register"&&!r.data.session){toast("Cadastro criado. Confirme seu e-mail para entrar.");return}user=r.data.user;await loadProfile();await loadData();appOn()}catch(e){toast(e.message||"Falha na autenticação")}finally{$("authSubmit").disabled=false}};
$("toggleAuth").onclick=()=>{authMode=authMode==="login"?"register":"login";$("authTitle").textContent=authMode==="login"?"Entrar na sua conta":"Criar sua conta";$("authSubmit").textContent=authMode==="login"?"Entrar":"Cadastrar";$("toggleAuth").textContent=authMode==="login"?"Criar conta":"Já tenho conta"};
$("forgot").onclick=async()=>{const email=$("email").value;if(!email)return toast("Informe seu e-mail primeiro.");const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?error.message:"Link de recuperação enviado, se o e-mail estiver cadastrado.")};
$("logout").onclick=async()=>{await sb.auth.signOut();user=null;appOff()};
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session&&!user){user=session.user;setTimeout(async()=>{if(!user||user.id!==session.user.id)return;try{await loadProfile();await loadData();appOn()}catch(e){console.error(e);toast("Falha ao carregar sua conta: "+e.message)}},0)}if(event==="SIGNED_OUT"){user=null;profile=null;records={metrics:[],sessions:[],cardio:[],meals:[],habits:[],exercises:[]};appOff()}});
function profileForm(){return '<div class="card"><h3 class="cardtitle">Vamos configurar seu perfil</h3><p class="muted" style="font-size:13px">Preencha seus dados reais. Não vamos presumir altura, peso ou idade.</p><form id="profileForm" class="stack"><div class="formgrid"><div class="field"><label>Nome</label><input name="display_name" value="'+esc(profile?.display_name||"")+'" required></div><div class="field"><label>Data de nascimento</label><input name="birth_date" type="date" value="'+(profile?.birth_date||"")+'"></div><div class="field"><label>Sexo (opcional)</label><select name="sex"><option value="">Prefiro não informar</option><option value="female" '+(profile?.sex==="female"?"selected":"")+'>Feminino</option><option value="male" '+(profile?.sex==="male"?"selected":"")+'>Masculino</option><option value="other" '+(profile?.sex==="other"?"selected":"")+'>Outro</option></select></div><div class="field"><label>Altura (cm)</label><input name="height_cm" type="number" min="100" max="230" value="'+(profile?.height_cm||"")+'"></div><div class="field"><label>Peso atual (kg)</label><input name="starting_weight_kg" type="number" step=".1" min="30" max="300" value="'+(profile?.starting_weight_kg||"")+'"></div><div class="field"><label>Peso-meta (kg, opcional)</label><input name="goal_weight_kg" type="number" step=".1" value="'+(profile?.goal_weight_kg||"")+'"></div></div><div class="field"><label>Restrições, alergias ou condições relevantes</label><textarea name="dietary_restrictions" rows="2">'+esc(Array.isArray(profile?.dietary_restrictions)?profile.dietary_restrictions.join(", "):"")+'</textarea></div><div class="field"><label>Preferências alimentares</label><textarea name="food_preferences" rows="2">'+esc(profile?.food_preferences||"")+'</textarea></div><button class="btn">Salvar meu perfil</button></form></div>'}
async function saveProfile(e){e.preventDefault();const f=new FormData(e.target),obj={user_id:user.id,display_name:f.get("display_name"),birth_date:f.get("birth_date")||null,sex:f.get("sex")||null,height_cm:numOrNull(f.get("height_cm")),starting_weight_kg:numOrNull(f.get("starting_weight_kg")),goal_weight_kg:numOrNull(f.get("goal_weight_kg")),dietary_restrictions:(f.get("dietary_restrictions")||"").split(",").map(x=>x.trim()).filter(Boolean),food_preferences:f.get("food_preferences"),updated_at:new Date().toISOString()};const {error}=await sb.from("shape_profiles").upsert(obj,{onConflict:"user_id"});if(error)return toast(error.message);await loadProfile();toast("Perfil salvo.");render()}
function numOrNull(v){return v===""||v==null?null:Number(v)}
function empty(t){return '<div class="empty">'+t+'</div>'}
function stat(label,val,unit=""){return '<div class="card span-3"><div class="muted" style="font-size:12px">'+label+'</div><div class="metric">'+(val??"—")+' <small>'+unit+'</small></div></div>'}
function dashboard(){const m=records.metrics[0],todayHabit=records.habits.find(x=>x.habit_date===today()),meals=records.meals.filter(x=>x.consumed_at?.slice(0,10)===today()),protein=meals.reduce((a,x)=>a+(x.protein_g||0),0),water=todayHabit?.water_ml||0;return '<div class="grid">'+stat("Peso atual",m?.weight_kg??profile?.starting_weight_kg??"—","kg")+stat("Água hoje",(water/1000).toFixed(1),"L")+stat("Proteína hoje",Math.round(protein),"g")+stat("Treinos registrados",records.sessions.length,"sessões")+'<div class="card span-8"><div class="row"><h3 class="cardtitle">Treino programado</h3><span class="pill">'+new Date().toLocaleDateString("pt-BR",{weekday:"long"})+'</span></div><h2 style="font-size:22px">Plano PPL — 6 dias</h2><p class="muted" style="font-size:13px">Musculação com progressão + cardio leve e mobilidade distribuídos na semana.</p><button class="btn" onclick="go(\'workout\')">Abrir treino</button></div><div class="card span-4"><h3 class="cardtitle">Seu próximo passo</h3><p class="muted" style="font-size:13px">'+(profile?.height_cm?"Registre o treino de hoje e acompanhe a evolução.":"Complete seu perfil para liberar estimativas personalizadas.")+'</p><button class="btn secondary" onclick="go(\'profile\')">Meu perfil</button></div><div class="card span-6"><h3 class="cardtitle">Atividade recente</h3>'+ (records.cardio.length?records.cardio.slice(0,3).map(x=>'<div class="item row"><strong>'+esc(x.activity_type)+'</strong><small>'+x.duration_minutes+' min · '+(x.distance_km||"—")+' km · '+fmtDate(x.performed_at)+'</small></div>').join(""):empty("Nenhum cardio registrado ainda."))+'</div><div class="card span-6"><h3 class="cardtitle">Últimos registros corporais</h3>'+(records.metrics.length?records.metrics.slice(0,3).map(x=>'<div class="item row"><strong>'+x.weight_kg+' kg</strong><small>'+fmtDate(x.measured_at)+'</small></div>').join(""):empty("Registre seu peso para iniciar o histórico."))+'</div></div>'}
const plan={mon:["PUSH A","Supino reto com barra|4|8–10;Desenvolvimento com halteres|3|10–12;Crossover|3|12–15;Elevação lateral|3|12–15;Tríceps corda|3|10–12","Corrida leve 15–20 min"],tue:["PULL A","Puxada alta|4|8–10;Remada curvada|3|8–10;Remada unilateral|3|10–12;Rosca direta|3|10–12;Rosca martelo|3|12–15","Mobilidade 8–12 min"],wed:["LEGS A","Agachamento|4|6–8;Leg press|3|10–12;Cadeira extensora|3|12–15;Mesa flexora|3|10–12;Panturrilha|4|12–15","Sem corrida obrigatória"],thu:["PUSH B","Supino inclinado|4|8–10;Desenvolvimento Arnold|3|10–12;Paralelas|3|8–10;Elevação lateral|3|12–15;Tríceps testa|3|10–12","Corrida leve 20–25 min"],fri:["PULL B","Levantamento terra|3|5–6;Remada articulada|4|10–12;Face pull|3|12–15;Rosca Scott|3|10–12","Mobilidade 8–12 min"],sat:["LEGS B","Stiff|4|8–10;Mesa flexora|4|10–12;Elevação pélvica|3|10–12;Panturrilha sentado|4|12–15","Caminhada leve"],sun:["DESCANSO","", "Recuperação"]};
const dayKey=["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];let selectedDay=dayKey;
function workout(){const p=plan[selectedDay],ex=p[1]?p[1].split(";").map(x=>x.split("|")):[];return '<div class="tabs">'+Object.entries({mon:"SEG",tue:"TER",wed:"QUA",thu:"QUI",fri:"SEX",sat:"SÁB",sun:"DOM"}).map(([k,v])=>'<button class="'+(selectedDay===k?"active":"")+'" onclick="selectedDay=\''+k+'\';render()">'+v+'</button>').join("")+'</div><div class="card"><div class="eyebrow">PLANO SEMANAL</div><h2>'+p[0]+'</h2><p class="muted">'+p[2]+'</p>'+ (ex.length?'<form id="workoutForm" class="stack">'+ex.map((x,i)=>'<div class="item"><div class="row"><strong>'+x[0]+'</strong><span class="pill">'+x[1]+' séries · '+x[2]+' reps</span><button type="button" class="demo-btn" onclick="showExercise(&quot;'+x[0]+'&quot;)">Ver execução</button></div><div class="exercise" style="margin-top:10px"><div class="field"><label>CARGA (KG)</label><input type="number" step=".5" min="0" name="weight'+i+'" placeholder="Sem registro"></div><div class="field"><label>SÉRIES FEITAS</label><input type="number" min="1" name="sets'+i+'" value="'+x[1]+'"></div><div class="field"><label>REPETIÇÕES</label><input name="reps'+i+'" value="'+x[2]+'"></div><div class="field"><label>RIR</label><input type="number" min="0" max="5" name="rir'+i+'" value="2"></div></div></div>').join("")+'<div class="field"><label>DURAÇÃO DO TREINO (MIN)</label><input name="duration" type="number" min="1" placeholder="Ex.: 70"></div><button class="btn">Salvar sessão no histórico</button></form>':'<div class="notice">Dia de descanso. Priorize sono, alimentação e recuperação.</div>')+'</div><div class="card" style="margin-top:14px"><div class="row"><h3 class="cardtitle">Histórico de sessões</h3><span class="pill">'+records.sessions.length+' registros</span></div>'+(records.sessions.length?records.sessions.slice(0,8).map(x=>'<div class="item row"><strong>'+esc(x.workout_name)+'</strong><small>'+fmtDate(x.performed_at)+' · '+(x.duration_minutes||"—")+' min</small></div>').join(""):empty("Seus treinos concluídos aparecerão aqui." async function saveWorkout(e){e.preventDefault();const f=new FormData(e.target),p=plan[selectedDay],names=p[1]?p[1].split(";").map(x=>x.split("|")):[];const button=e.submitter;if(button)button.disabled=true;try{const {data,error}=await sb.from("shape_workout_sessions").insert({user_id:user.id,performed_at:new Date().toISOString(),workout_name:p[0],duration_minutes:numOrNull(f.get("duration")),completed:true}).select().single();if(error)throw error;const logs=names.map((x,i)=>({user_id:user.id,session_id:data.id,exercise_name:x[0],sets:numOrNull(f.get("sets"+i)),reps:f.get("reps"+i),load_kg:numOrNull(f.get("weight"+i)),rir:numOrNull(f.get("rir"+i))}));if(logs.length){const result=await sb.from("shape_exercise_logs").insert(logs);if(result.error){await sb.from("shape_workout_sessions").delete().eq("id",data.id).eq("user_id",user.id);throw result.error}}await loadData();toast("Treino salvo no histórico.");render()}catch(err){console.error(err);toast("Não foi possível salvar o treino: "+err.message);if(button)button.disabled=false}}
function cardio(){return '<div class="grid"><div class="card span-6"><h3 class="cardtitle">Registrar cardio</h3><form id="cardioForm" class="stack"><div class="formgrid"><div class="field"><label>ATIVIDADE</label><select name="type"><option value="run">Corrida</option><option value="walk">Caminhada</option><option value="bike">Bicicleta</option><option value="other">Outra</option></select></div><div class="field"><label>DATA</label><input type="date" name="date" value="'+today()+'" required></div><div class="field"><label>DURAÇÃO (MIN)</label><input type="number" name="duration" min="1" required></div><div class="field"><label>DISTÂNCIA (KM)</label><input type="number" name="distance" step=".01" min="0"></div><div class="field"><label>ESFORÇO (1–10)</label><input type="number" name="effort" min="1" max="10"></div></div><div class="field"><label>OBSERVAÇÕES</label><input name="notes" placeholder="Como foi a sessão?"></div><button class="btn">Salvar cardio</button></form></div><div class="card span-6"><h3 class="cardtitle">Progressão sugerida de corrida</h3><p class="muted" style="font-size:13px">Comece em ritmo confortável, no qual consiga falar frases curtas. Aumente duração gradualmente e reduza se houver dor ou fadiga excessiva.</p><div class="notice">Se está retomando, experimente 20 minutos leves como ponto de partida apenas se estiver confortável. Não é uma meta obrigatória. Faça aquecimento e desaquecimento.</div></div><div class="card span-12"><h3 class="cardtitle">Histórico de cardio</h3>'+(records.cardio.length?'<table class="table"><thead><tr><th>Data</th><th>Atividade</th><th>Duração</th><th>Distância</th><th>Ritmo</th></tr></thead><tbody>'+records.cardio.map(x=>'<tr><td>'+fmtDate(x.performed_at)+'</td><td>'+esc(({run:"Corrida",walk:"Caminhada",bike:"Bicicleta",other:"Outra"}[x.activity_type]||x.activity_type))+'</td><td>'+x.duration_minutes+' min</td><td>'+(x.distance_km??"—")+' km</td><td>'+(x.average_pace||"—")+'</td></tr>').join("")+'</tbody></table>':empty("Nenhuma atividade registrada."))+'</div></div>'}
async function saveCardio(e){e.preventDefault();const f=new FormData(e.target),d=numOrNull(f.get("distance")),m=numOrNull(f.get("duration"));let pace=null;if(d>0&&m>0){const total=Math.round(m/d*60),minutes=Math.floor(total/60),seconds=total%60;pace=minutes+":"+String(seconds).padStart(2,"0")}const button=e.submitter;if(button)button.disabled=true;try{const {error}=await sb.from("shape_cardio_logs").insert({user_id:user.id,performed_at:new Date(f.get("date")+"T12:00:00").toISOString(),activity_type:f.get("type"),duration_minutes:m,distance_km:d,average_pace:pace,perceived_effort:numOrNull(f.get("effort")),notes:f.get("notes")});if(error)throw error;await loadData();toast("Cardio registrado.");render()}catch(err){console.error(err);toast("Não foi possível salvar o cardio: "+err.message);if(button)button.disabled=false}}

let exerciseLibraryPromise=null;
function normalizeName(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
const gifAliases={"barbell squat":["barbell full squat","full squat"],"cable crossover":["cable standing fly","standing cable fly","cable cross over"],"cable rope pushdown":["cable rope triceps pushdown","rope pushdown"],"lat pulldown":["cable lat pulldown","wide grip lat pulldown"],"dumbbell shoulder press":["dumbbell seated shoulder press","seated dumbbell shoulder press"],"dumbbell single arm row":["single arm dumbbell row","one arm dumbbell row"],"lever seated row":["seated cable row","machine seated row"],"ez bar lying triceps extension":["lying ez bar triceps extension"],"ez bar preacher curl":["preacher curl"],"dumbbell romanian deadlift":["romanian deadlift"],"90 90 hip stretch":["90/90 hip stretch","90 90 stretch"],"kneeling hip flexor stretch":["half kneeling hip flexor stretch"],"ankle dorsiflexion mobilization":["ankle dorsiflexion","ankle mobility"],"band shoulder external rotation":["shoulder external rotation","band external rotation"],"cat cow stretch":["cat cow","cat camel stretch"],"side lying thoracic rotation":["thoracic rotation"]};
async function getGifFor(englishName){try{if(!exerciseLibraryPromise)exerciseLibraryPromise=fetch("https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json").then(r=>{if(!r.ok)throw Error("Biblioteca indisponível ("+r.status+")");return r.json()}).catch(err=>{exerciseLibraryPromise=null;throw err});const arr=await exerciseLibraryPromise;if(!Array.isArray(arr))throw Error("Formato de biblioteca inválido");const key=normalizeName(englishName),aliases=[key,...(gifAliases[key]||[]).map(normalizeName)];let hit=null;for(const alias of aliases){hit=arr.find(x=>normalizeName(x.name)===alias);if(hit)break;const tokens=alias.split(" ").filter(x=>x.length>2);if(tokens.length){hit=arr.find(x=>{const candidate=normalizeName(x.name).split(" ");return tokens.every(t=>candidate.includes(t))});if(hit)break}}if(!hit)return null;const path=String(hit.gif_url||"").trim();if(/^https?:\/\//i.test(path))return {url:path,attribution:hit.attribution||"© Gym visual"};if(path)return {url:"https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/"+path.replace(/^\.\//,""),attribution:hit.attribution||"© Gym visual"};return hit.media_id?{url:"https://static.exercisedb.dev/media/"+hit.media_id+".gif",attribution:hit.attribution||"© Gym visual"}:null}catch(e){console.warn("GIF:",e);return null}}

async function showExercise(name,isMobility=false){const request=++demoRequestId,g=(isMobility?mobilityGuide:exerciseGuide)[name];if(!g)return toast("Demonstração ainda não cadastrada.");$("demoContent").innerHTML='<div class="row"><div><div class="eyebrow">GUIA DE MOVIMENTO</div><h2 style="margin:5px 0">'+esc(name)+'</h2></div><button class="btn secondary" onclick="closeDemo()">Fechar</button></div><div id="demoMediaArea" class="demo-step" aria-live="polite">Carregando demonstração animada…</div>'+(g.muscle?'<div class="demo-section">O QUE TRABALHA</div><p>'+esc(g.muscle)+'</p>':'')+(g.equipment?'<div class="demo-section">EQUIPAMENTO</div><p>'+esc(g.equipment)+'</p>':'')+'<div class="demo-section">COMO FAZER</div>'+g.steps.map((s,i)=>'<div class="demo-step"><b>'+(i+1)+'.</b> '+esc(s)+'</div>').join("")+'<div class="demo-section">RESPIRAÇÃO</div><p>'+esc(g.breath)+'</p><div class="demo-section">ERROS A EVITAR</div><p>'+esc(g.errors)+'</p><p class="footnote">Faça o movimento sem dor. Ajuste a amplitude e a carga à sua capacidade; em caso de dor persistente, interrompa e procure orientação profissional.</p>';$("demoModal").classList.remove("hidden");const area=$("demoMediaArea");if(!g.en){area.innerHTML='<b>Mobilidade guiada</b><br><span class="muted">Siga as etapas numeradas e faça o movimento lentamente, sem forçar a amplitude.</span>';return}const gif=await getGifFor(g.en);if(request!==demoRequestId||$("demoModal").classList.contains("hidden"))return;if(!gif){area.innerHTML='<b>GIF não localizado nesta biblioteca.</b><br><span class="muted">As instruções acima continuam disponíveis. Não foi usado um movimento parecido para evitar uma demonstração incorreta.</span>';return}area.innerHTML='<img class="demo-media" src="'+esc(gif.url)+'" alt="Demonstração animada: '+esc(name)+'" loading="eager"><div class="footnote">Animação: '+esc(gif.attribution)+'. Compare a postura com as instruções acima.</div>';const img=area.querySelector("img");img.onerror=()=>{area.innerHTML='<b>GIF temporariamente indisponível.</b><br><span class="muted">A biblioteca não entregou a animação; siga as instruções escritas.</span>'}}
function closeDemo(){demoRequestId++;$("demoModal").classList.add("hidden")}document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("demoModal").classList.contains("hidden"))closeDemo()});

const mobility=[["Quadril","90/90 sentado","8 por lado"],["Quadril","Alongamento do flexor do quadril","30 s por lado"],["Tornozelo","Avanço com joelho à parede","10 por lado"],["Ombros","Rotação externa controlada","12 repetições"],["Coluna","Cat-cow","10 repetições"],["Coluna","Rotação torácica deitado","8 por lado"]];
function mobilityView(){return '<div class="grid"><div class="card span-8"><h3 class="cardtitle">Rotina de mobilidade · 8–12 minutos</h3><div class="list">'+mobility.map((x,i)=>'<label class="item row"><span><strong>'+x[1]+'</strong><br><small>'+x[0]+' · '+x[2]+'</small><br><button type="button" class="demo-btn" style="margin-top:8px" onclick="showExercise(&quot;'+x[1]+'&quot;,true)">Ver movimento</button></span><input type="checkbox" class="mobcheck" style="accent-color:var(--lime)"></label>').join("")+'</div><button class="btn" style="margin-top:14px" id="saveMobility">Marcar rotina concluída</button></div><div class="card span-4"><h3 class="cardtitle">Orientação</h3><p class="muted" style="font-size:13px">Movimente sem forçar amplitude e sem dor. Respire normalmente. Use como aquecimento dinâmico ou sessão leve de recuperação.</p></div></div>'}
async function saveHabitRecord(obj){const {error}=await sb.from("shape_daily_habits").upsert(obj,{onConflict:"user_id,habit_date"});if(error)throw error}
async function saveMobility(){const old=records.habits.find(x=>x.habit_date===today());const obj={user_id:user.id,habit_date:today(),water_ml:old?.water_ml||0,sleep_hours:old?.sleep_hours??null,sauna_minutes:old?.sauna_minutes||0,cold_plunge_minutes:old?.cold_plunge_minutes||0,mobility_completed:true};try{await saveHabitRecord(obj);await loadData();toast("Mobilidade marcada.");render()}catch(e){toast(e.message)}}
function nutrition(){const kg=records.metrics[0]?.weight_kg||profile?.starting_weight_kg;const target=kg?Math.round(kg*1.6)+"–"+Math.round(kg*2)+" g/dia":"após informar seu peso";const todayMeals=records.meals.filter(x=>x.consumed_at?.slice(0,10)===today());return '<div class="grid"><div class="card span-4"><div class="eyebrow">REFERÊNCIA PROTEICA</div><div class="metric">'+target+'</div><p class="muted" style="font-size:12px">Faixa inicial orientativa de 1,6–2,0 g/kg/dia. Não é prescrição clínica.</p></div><div class="card span-8"><h3 class="cardtitle">Ideias de refeições</h3><div class="list"><div class="item"><strong>Café da manhã</strong><p class="muted">Ovos + pão integral + fruta; ou iogurte natural com aveia e banana. Ajuste por fome, rotina e restrições.</p></div><div class="item"><strong>Almoço</strong><p class="muted">Arroz, feijão, frango/ovo/peixe ou proteína vegetal, legumes e salada.</p></div><div class="item"><strong>Lanche / pré-treino</strong><p class="muted">Banana com iogurte; ou pão com queijo/ovo. Escolha algo que tolere bem.</p></div><div class="item"><strong>Jantar / pós-treino</strong><p class="muted">Refeição completa com fonte de proteína, carboidrato e vegetais. Não precisa ser um shake.</p></div></div><p class="footnote">As sugestões são gerais. A personalização depende de perfil completo, alergias, condições de saúde e rotina.</p></div><div class="card span-6"><h3 class="cardtitle">Registrar refeição</h3><form id="mealForm" class="stack"><div class="field"><label>REFEIÇÃO</label><select name="type"><option value="breakfast">Café da manhã</option><option value="lunch">Almoço</option><option value="snack">Lanche / pré ou pós-treino</option><option value="dinner">Jantar</option><option value="other">Outra</option></select></div><div class="field"><label>ALIMENTOS / DESCRIÇÃO</label><input name="description" required placeholder="Ex.: arroz, feijão e frango"></div><div class="formgrid"><div class="field"><label>CALORIAS (ESTIMATIVA)</label><input name="kcal" type="number" min="0"></div><div class="field"><label>PROTEÍNA (G)</label><input name="protein" type="number" min="0"></div><div class="field"><label>CARBOIDRATOS (G)</label><input name="carbs" type="number" min="0"></div><div class="field"><label>GORDURAS (G)</label><input name="fat" type="number" min="0"></div></div><button class="btn">Salvar refeição</button></form></div><div class="card span-6"><h3 class="cardtitle">Diário de hoje</h3>'+(todayMeals.length?todayMeals.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.meal_type)+'</strong><small>'+new Date(x.consumed_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</small></div><p class="muted">'+esc(x.description)+'</p><small>'+x.protein_g+'g proteína · '+x.carbs_g+'g carbo · '+x.fat_g+'g gordura</small></div>').join(""):empty("Nenhuma refeição registrada hoje."))+'</div></div>'}
async function saveMeal(e){e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("shape_food_logs").insert({user_id:user.id,consumed_at:new Date().toISOString(),meal_type:f.get("type"),description:f.get("description"),estimated_calories:numOrNull(f.get("kcal")),protein_g:numOrNull(f.get("protein")),carbs_g:numOrNull(f.get("carbs")),fat_g:numOrNull(f.get("fat"))});if(error)return toast(error.message);await loadData();toast("Refeição salva.");render()}
function bodyView(){return '<div class="grid"><div class="card span-5"><h3 class="cardtitle">Novo registro corporal</h3><form id="bodyForm" class="stack"><div class="field"><label>DATA</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>PESO (KG)</label><input name="weight" type="number" step=".1" min="30" required></div><div class="field"><label>CINTURA (CM)</label><input name="waist" type="number" step=".5" min="30"></div><div class="field"><label>OBSERVAÇÕES</label><input name="notes"></div><button class="btn">Salvar medição</button></form></div><div class="card span-7"><h3 class="cardtitle">Histórico de evolução</h3>'+(records.metrics.length?'<table class="table"><thead><tr><th>Data</th><th>Peso</th><th>Cintura</th></tr></thead><tbody>'+records.metrics.map(x=>'<tr><td>'+fmtDate(x.measured_at)+'</td><td>'+x.weight_kg+' kg</td><td>'+(x.waist_cm??"—")+'</td></tr>').join("")+'</tbody></table>':empty("Sem medições. Registre o primeiro peso para iniciar seu histórico."))+'</div></div>'}
async function saveBody(e){e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("shape_body_metrics").insert({user_id:user.id,measured_at:f.get("date"),weight_kg:numOrNull(f.get("weight")),waist_cm:numOrNull(f.get("waist")),notes:f.get("notes")});if(error)return toast(error.message);await loadData();toast("Medição salva.");render()}
function habits(){const h=records.habits.find(x=>x.habit_date===today())||{};return '<div class="grid"><div class="card span-6"><h3 class="cardtitle">Check-in diário</h3><form id="habitForm" class="stack"><div class="field"><label>ÁGUA CONSUMIDA (ML)</label><input name="water" type="number" min="0" step="100" value="'+(h.water_ml||"")+'" placeholder="Ex.: 2000"></div><div class="field"><label>SONO (HORAS)</label><input name="sleep" type="number" min="0" max="24" step=".25" value="'+(h.sleep_hours||"")+'"></div><div class="formgrid"><div class="field"><label>SAUNA (MIN, OPCIONAL)</label><input name="sauna" type="number" min="0" value="'+(h.sauna_minutes||0)+'"></div><div class="field"><label>PISCINA GELADA (MIN, OPCIONAL)</label><input name="cold" type="number" min="0" value="'+(h.cold_plunge_minutes||0)+'"></div></div><label class="row"><span>Mobilidade concluída</span><input type="checkbox" name="mobility" '+(h.mobility_completed?"checked":"")+'></label><button class="btn">Salvar hábitos de hoje</button></form></div><div class="card span-6"><h3 class="cardtitle">Hidratação e recuperação</h3><p class="muted" style="font-size:13px">Não existe uma meta única de água adequada para todos. Use sede, clima, suor, duração do exercício e orientação profissional. Registre o volume para observar seu padrão.</p><div class="notice">Sauna e imersão fria são opcionais, não aceleram automaticamente a transformação física. Evite extremos, não faça sozinho se houver risco de desmaio e interrompa ao sentir tontura, falta de ar, dor ou mal-estar. Com doença cardiovascular, pressão alterada, gestação ou condição clínica, converse com profissional antes.</div><p class="footnote">Sono regular e dias de recuperação fazem parte do treino. Para adultos, a referência geral costuma ser 7–9 horas, com variação individual.</p></div></div>'}
async function saveHabits(e){e.preventDefault();const f=new FormData(e.target),obj={user_id:user.id,habit_date:today(),water_ml:numOrNull(f.get("water"))||0,sleep_hours:numOrNull(f.get("sleep")),sauna_minutes:numOrNull(f.get("sauna"))||0,cold_plunge_minutes:numOrNull(f.get("cold"))||0,mobility_completed:f.get("mobility")==="on"};try{await saveHabitRecord(obj);await loadData();toast("Hábitos salvos.");render()}catch(e){toast(e.message)}}
function assistant(){const p=profile,kg=records.metrics[0]?.weight_kg||p?.starting_weight_kg,protein=kg?Math.round(kg*1.6)+"–"+Math.round(kg*2)+" g":"informe seu peso para estimar";return '<div class="grid"><div class="card span-8"><div class="eyebrow">ORIENTAÇÕES BASEADAS NOS SEUS DADOS</div><h2>Plano de ação</h2><div class="list"><div class="item"><strong>Treinamento</strong><p class="muted">Mantenha progressão gradual, registre séries e cargas e evite falhar em todas as séries. Use 1–3 repetições em reserva como referência ajustável.</p></div><div class="item"><strong>Cardio</strong><p class="muted">Duas sessões leves de corrida podem complementar o PPL, desde que recuperação e articulações estejam bem. Comece abaixo do limite e progrida devagar.</p></div><div class="item"><strong>Proteína</strong><p class="muted">Faixa inicial estimada: '+protein+'/dia. Distribua entre refeições conforme preferência e tolerância.</p></div><div class="item"><strong>Recuperação</strong><p class="muted">Priorize sono, alimentação suficiente e descanso. Sauna e piscina fria não substituem recuperação.</p></div></div></div><div class="card span-4"><h3 class="cardtitle">Dados disponíveis</h3><p class="muted" style="font-size:13px">Perfil: '+(p?.height_cm?"altura informada":"altura pendente")+'<br>Registros corporais: '+records.metrics.length+'<br>Treinos: '+records.sessions.length+'<br>Cardios: '+records.cardio.length+'<br>Refeições: '+records.meals.length+'</p><div class="notice">As orientações são gerais e não substituem avaliação de médico ou nutricionista. Ainda não há análise automática por IA.</div></div></div>'}
function render(){if(!user)return;const v=$("view");if(!profile){v.innerHTML=profileForm();$("profileForm").onsubmit=saveProfile;return}const views={dashboard,workout,cardio,mobility:mobilityView,nutrition,body:bodyView,habits,assistant,profile:profileForm};v.innerHTML=(views[tab]||dashboard)();const handlers={workoutForm:saveWorkout,cardioForm:saveCardio,mealForm:saveMeal,bodyForm:saveBody,habitForm:saveHabits,profileForm:saveProfile};Object.entries(handlers).forEach(([id,fn])=>{if($(id))$(id).onsubmit=fn});if($("saveMobility"))$("saveMobility").onclick=saveMobility}
boot().catch(e=>{console.error(e);toast("Erro ao iniciar: "+e.message)});

</script></body></html>
