<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Comissões</title><style>:root{--b:#0a0d11;--p:#131820;--p2:#0e1319;--l:#27303a;--t:#f4f7fa;--m:#96a2ae;--g:#31d17c;--y:#f1b94c;--r:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#090b0e,#0e1318);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:88px}header{position:sticky;top:0;background:#0a0d11ee;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff0d;padding:16px;z-index:4}.top{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}h1{font-size:22px;margin:2px 0 0}button,input,select,textarea{font:inherit}.gear{width:40px;height:40px;border:1px solid var(--l);background:var(--p);color:#fff;border-radius:12px}main{padding:16px}.page{display:none}.page.on{display:block}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.chip{border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:800}.chip.on{background:#fff;color:#0a0d11}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#1a222c,#11161c)}.label{font-size:12px;color:var(--m)}.total{font-size:36px;font-weight:900;margin:6px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:var(--p2);border:1px solid var(--l);border-radius:15px;padding:12px}.metric span{display:block;font-size:11px;color:var(--m)}.metric b{display:block;font-size:18px;margin-top:4px}.st{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.st h2{font-size:17px;margin:0}.st small{color:var(--m)}.empty{text-align:center;color:var(--m);border:1px dashed #35404c;border-radius:17px;padding:28px 15px}.sale{display:flex;gap:11px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:17px;padding:13px;margin-bottom:9px}.ci{width:42px;height:42px;border-radius:13px;background:#1c232c;display:grid;place-items:center;flex:0 0 auto}.sb{min-width:0;flex:1}.sb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb small{display:block;color:var(--m);font-size:12px;margin-top:4px}.money{text-align:right}.tag{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900}.received{color:var(--g);background:#31d17c1e}.pending{color:var(--y);background:#f1b94c1e}.none{color:var(--r);background:#ff6b6b1e}.acts{display:flex;gap:6px;margin-top:7px}.acts button{border:0;background:#202832;color:#d5dde6;border-radius:8px;padding:6px 8px;font-size:11px}label{display:block;color:var(--m);font-size:12px;margin:12px 0 6px}input,select,textarea{width:100%;background:#0c1117;border:1px solid #2b3540;color:#fff;border-radius:12px;padding:13px;outline:none}textarea{min-height:80px}.primary,.secondary,.danger{width:100%;border-radius:13px;padding:14px;font-weight:900;margin-top:10px}.primary{border:0;background:#fff;color:#0a0d11}.secondary{border:1px solid var(--l);background:#171e26;color:#fff}.danger{border:1px solid #ff6b6b55;background:#ff6b6b14;color:#ff8989}.month{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:15px;margin-bottom:9px}.mt{display:flex;justify-content:space-between;gap:8px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--m);font-size:11px;margin-top:8px}.fab{position:fixed;right:max(16px,calc((100vw - 640px)/2 + 16px));bottom:82px;width:60px;height:60px;border:0;border-radius:18px;background:#fff;color:#0a0d11;font-size:31px;font-weight:900;box-shadow:0 15px 35px #0007;z-index:6}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#0a0d11f5;border-top:1px solid var(--l);padding:8px 5px 10px;z-index:5}nav button{border:0;background:none;color:var(--m);font-size:11px;font-weight:800;padding:7px}nav button.on{color:#fff}nav b{display:block;font-size:19px}.toast{display:none;position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#111;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:900;z-index:10}</style></head><body><div class="app"><header><div class="top"><div><div class="ey">Controle pessoal</div><h1 id="title">Resumo</h1></div><button class="gear" onclick="go('settings','Configurações')">⚙</button></div></header><main><section id="home" class="page on"><div class="chips"><button class="chip on" onclick="period='week';chips(this,'#home');renderHome()">Esta semana</button><button class="chip" onclick="period='month';chips(this,'#home');renderHome()">Este mês</button><button class="chip" onclick="period='all';chips(this,'#home');renderHome()">Tudo</button></div><div class="card hero"><div class="label">Total recebido no período</div><div class="total" id="grand">R$ 0,00</div><div class="grid"><div class="metric"><span>Comissões recebidas</span><b id="comm">R$ 0,00</b></div><div class="metric"><span>Salário</span><b id="sal">R$ 0,00</b></div><div class="metric"><span>Carros vendidos</span><b id="count">0</b></div><div class="metric"><span>Pendentes</span><b id="pend">0</b></div></div></div><div class="st"><h2>Vendas do período</h2><small id="range"></small></div><div id="sales"></div></section><section id="new" class="page"><div class="card"><h2 style="margin-top:0">Registrar venda</h2><input type="hidden" id="eid"><label>Data da venda</label><input type="date" id="date"><label>Carro</label><input id="car" placeholder="Digite o carro"><label>Quem vendeu?</label><select id="seller"><option>Matheus</option><option>Patrão</option><option>Outro</option></select><label>Situação da comissão</label><select id="status" onchange="toggleComm()"><option value="pending">Ainda não sei / pendente</option><option value="received">Recebi comissão</option><option value="none">Sem comissão</option></select><div id="cf" style="display:none"><label>Valor da comissão</label><input type="number" id="value" step="0.01" min="0" placeholder="0,00"><label>Data em que recebeu</label><input type="date" id="rdate"></div><label>Observação</label><textarea id="note" placeholder="Opcional"></textarea><button class="primary" onclick="save()">Salvar venda</button><button class="secondary" onclick="clearForm();go('home','Resumo')">Cancelar</button></div></section><section id="history" class="page"><div class="chips"><button class="chip on" onclick="hist='all';chips(this,'#history');renderHistory()">Todos</button><button class="chip" onclick="hist='received';chips(this,'#history');renderHistory()">Recebidos</button><button class="chip" onclick="hist='pending';chips(this,'#history');renderHistory()">Pendentes</button><button class="chip" onclick="hist='none';chips(this,'#history');renderHistory()">Sem comissão</button></div><div id="historyList"></div></section><section id="months" class="page"><div id="monthsList"></div></section><section id="settings" class="page"><div class="card"><h2 style="margin-top:0">Configurações</h2><label>Salário semanal</label><input type="number" id="weekly" value="400"><label>Regra</label><select id="rule"><option value="four">4 pagamentos por mês</option><option value="every">Todo sábado</option></select><button class="primary" onclick="saveSettings()">Salvar configurações</button><button class="danger" onclick="wipe()">Apagar todos os dados</button></div></section></main><button class="fab" onclick="clearForm();go('new','Nova venda')">+</button><nav><button class="on" data-p="home" onclick="go('home','Resumo',this)"><b>⌂</b>Resumo</button><button data-p="history" onclick="go('history','Vendas',this)"><b>☷</b>Vendas</button><button data-p="months" onclick="go('months','Meses',this)"><b>▦</b>Meses</button><button data-p="new" onclick="clearForm();go('new','Nova venda',this)"><b>＋</b>Lançar</button></nav><div class="toast" id="toast"></div></div><script>const K='vellon_comissoes_v2',S='vellon_comissoes_settings_v2';let period='week',hist='all';const $=id=>document.getElementById(id),m=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),data=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}},put=v=>localStorage.setItem(K,JSON.stringify(v)),settings=()=>{try{return JSON.parse(localStorage.getItem(S))||{weekly:400,rule:'four'}}catch{return{weekly:400,rule:'four'}}};function esc(v){return String(v||'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}function today(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}function fd(s){if(!s)return'';let[y,mo,d]=s.split('-');return`${d}/${mo}/${y}`}function weekStart(d=new Date()){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x}function bounds(){let n=new Date();if(period==='week'){let a=weekStart(n),b=new Date(a);b.setDate(b.getDate()+6);b.setHours(23,59,59,999);return[a,b]}if(period==='month')return[new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,0,23,59,59,999)];return[new Date(2000,0,1),new Date(2100,0,1)]}function inb(s,b){let d=new Date(s+'T12:00:00');return d>=b[0]&&d<=b[1]}function salary(){if(period==='all')return 0;let z=settings(),n=new Date();if(period==='week'){let a=weekStart(n),sat=new Date(a);sat.setDate(sat.getDate()+5);return n>=sat?+z.weekly:0}let c=0,d=new Date(n.getFullYear(),n.getMonth(),1);while(d.getMonth()===n.getMonth()){if(d.getDay()===6&&d<=n)c++;d.setDate(d.getDate()+1)}if(z.rule==='four')c=Math.min(c,4);return c*(+z.weekly||0)}function chips(btn,scope){document.querySelectorAll(scope+' .chip').forEach(x=>x.classList.remove('on'));btn.classList.add('on')}function tag(s){return s==='received'?['Recebida','received']:s==='none'?['Sem comissão','none']:['Pendente','pending']}function row(x){let[t,c]=tag(x.status);return`<div class="sale"><div class="ci">🚗</div><div class="sb"><b>${esc(x.car)}</b><small>${fd(x.date)} • ${esc(x.seller)}</small><div class="acts"><button onclick="edit('${x.id}')">Editar</button><button onclick="del('${x.id}')">Excluir</button></div></div><div class="money"><b>${x.status==='received'?m(x.value):'—'}</b><div class="tag ${c}">${t}</div></div></div>`}function renderHome(){let all=data(),b=bounds(),l=period==='all'?all:all.filter(x=>inb(x.date,b)),c=l.filter(x=>x.status==='received').reduce((a,x)=>a+(+x.value||0),0),s=salary();$('comm').textContent=m(c);$('sal').textContent=m(s);$('grand').textContent=m(c+s);$('count').textContent=l.length;$('pend').textContent=l.filter(x=>x.status==='pending').length;$('range').textContent=period==='week'?'semana atual':period==='month'?'mês atual':'histórico';$('sales').innerHTML=l.length?[...l].sort((a,b)=>b.date.localeCompare(a.date)).map(row).join(''):'<div class="empty">Nenhuma venda registrada.<br><br>Toque no <b>+</b> para lançar a primeira.</div>'}function renderHistory(){let l=[...data()].sort((a,b)=>b.date.localeCompare(a.date));if(hist!=='all')l=l.filter(x=>x.status===hist);$('historyList').innerHTML=l.length?l.map(row).join(''):'<div class="empty">Nenhum registro nessa categoria.</div>'}function renderMonths(){let g={};data().forEach(x=>(g[x.date.slice(0,7)]??=[]).push(x));let ks=Object.keys(g).sort().reverse();$('monthsList').innerHTML=ks.length?ks.map(k=>{let a=g[k],c=a.filter(x=>x.status==='received').reduce((q,x)=>q+(+x.value||0),0),p=a.filter(x=>x.status==='pending').length,n=a.filter(x=>x.status==='none').length,[y,mo]=k.split('-').map(Number),name=new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});name=name[0].toUpperCase()+name.slice(1);return`<div class="month"><div class="mt"><b>${name}</b><b>${m(c)}</b></div><div class="meta"><span>${a.length} carros</span><span>${a.filter(x=>x.status==='received').length} recebidas</span><span>${p} pendentes</span><span>${n} sem comissão</span></div></div>`}).join(''):'<div class="empty">Os meses aparecerão conforme você registrar vendas.</div>'}function toggleComm(){$('cf').style.display=$('status').value==='received'?'block':'none'}function clearForm(){$('eid').value='';$('date').value=today();$('car').value='';$('seller').value='Matheus';$('status').value='pending';$('value').value='';$('rdate').value=today();$('note').value='';toggleComm()}function toast(s){let e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1500)}function save(){let car=$('car').value.trim(),date=$('date').value,status=$('status').value,val=+$('value').value||0;if(!car||!date)return toast('Preencha carro e data');if(status==='received'&&val<=0)return toast('Informe a comissão');let a=data(),id=$('eid').value||String(Date.now()),x={id,date,car,seller:$('seller').value,status,value:status==='received'?val:0,rdate:status==='received'?$('rdate').value:'',note:$('note').value.trim()},i=a.findIndex(q=>q.id===id);i>=0?a[i]=x:a.push(x);put(a);clearForm();renderAll();go('home','Resumo');toast(i>=0?'Venda atualizada':'Venda salva')}function edit(id){let x=data().find(q=>q.id===id);if(!x)return;$('eid').value=x.id;$('date').value=x.date;$('car').value=x.car;$('seller').value=x.seller;$('status').value=x.status;$('value').value=x.value||'';$('rdate').value=x.rdate||today();$('note').value=x.note||'';toggleComm();go('new','Editar venda')}function del(id){if(!confirm('Excluir este registro?'))return;put(data().filter(x=>x.id!==id));renderAll();toast('Registro excluído')}function saveSettings(){localStorage.setItem(S,JSON.stringify({weekly:+$('weekly').value||400,rule:$('rule').value}));renderAll();toast('Configurações salvas')}function loadSettings(){let z=settings();$('weekly').value=z.weekly;$('rule').value=z.rule}function wipe(){if(!confirm('Apagar todos os dados?'))return;localStorage.removeItem(K);renderAll();toast('Dados apagados')}function go(id,title,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');$('title').textContent=title;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));let n=btn||document.querySelector(`nav button[data-p="${id}"]`);if(n)n.classList.add('on');if(id==='home')renderHome();if(id==='history')renderHistory();if(id==='months')renderMonths();if(id==='settings')loadSettings();scrollTo({top:0,behavior:'smooth'})}function renderAll(){renderHome();renderHistory();renderMonths()}clearForm();loadSettings();renderAll();</script></body></html>
